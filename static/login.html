<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AlgoBot Pro — Login</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#07080e"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#07080e;--sf:#0d1018;--s2:#141923;
  --bd:#1c2a3e;--cy:#00e5ff;--pu:#8b5cf6;--gn:#10b981;--rd:#f43f5e;
  --tx:#e2e8f0;--m1:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--tx);
  font-family:'Inter',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:32px 28px;width:100%;max-width:380px;
}
.logo{
  font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:2px;
  font-size:20px;text-align:center;margin-bottom:6px;
}
.logo .a{color:var(--cy);}.logo .b{color:var(--m1);}
.sub{text-align:center;color:var(--m1);font-size:12px;margin-bottom:26px;}
.tabs{display:flex;background:var(--s2);border-radius:8px;padding:3px;margin-bottom:20px;}
.tab-btn{flex:1;padding:8px;text-align:center;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--m1);transition:.2s;}
.tab-btn.active{background:var(--cy);color:#000;}
.field{margin-bottom:14px;}
label{font-size:11px;font-weight:600;color:var(--m1);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;}
input{
  width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:6px;
  padding:11px 12px;color:var(--tx);font-size:14px;outline:none;transition:.2s;
}
input:focus{border-color:var(--cy);}
.btn{
  width:100%;padding:12px;border-radius:7px;border:none;
  background:var(--cy);color:#000;font-weight:700;font-size:14px;
  cursor:pointer;margin-top:6px;transition:.2s;
}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{
  font-size:12px;padding:9px 12px;border-radius:6px;margin-bottom:14px;display:none;
}
.msg.error{background:rgba(244,63,94,.1);color:var(--rd);border:1px solid rgba(244,63,94,.25);display:block;}
.msg.success{background:rgba(16,185,129,.1);color:var(--gn);border:1px solid rgba(16,185,129,.25);display:block;}
.hint{font-size:10px;color:var(--m1);margin-top:16px;text-align:center;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="a">ALGO</span><span class="b">BOT</span></div>
  <div class="sub">Pro v6 — Sign in to your dashboard</div>

  <div class="tabs">
    <div class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</div>
    <div class="tab-btn" id="tabRegister" onclick="switchTab('register')">Create Account</div>
  </div>

  <div id="msg" class="msg"></div>

  <form id="authForm">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn" id="submitBtn">Log In</button>
  </form>

  <div class="hint">Your password is hashed and never stored in plain text.<br/>Session stays valid for 7 days.</div>
</div>

<script>
let mode = 'login';

function switchTab(m){
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m==='login');
  document.getElementById('tabRegister').classList.toggle('active', m==='register');
  document.getElementById('submitBtn').textContent = m === 'login' ? 'Log In' : 'Create Account';
  document.getElementById('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  hideMsg();
}

function showMsg(text, type){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function hideMsg(){
  const el = document.getElementById('msg');
  el.className = 'msg';
}

// If already logged in, skip straight to dashboard
if(localStorage.getItem('algobot_token')){
  window.location.href = '/dashboard.html';
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMsg();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = mode === 'login' ? 'Logging in...' : 'Creating account...';

  try{
    const res = await fetch(`/api/${mode}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(!res.ok){
      showMsg(data.error || 'Something went wrong', 'error');
      btn.disabled = false;
      btn.textContent = mode === 'login' ? 'Log In' : 'Create Account';
      return;
    }
    localStorage.setItem('algobot_token', data.token);
    localStorage.setItem('algobot_user', JSON.stringify(data.user));
    showMsg('Success! Redirecting...', 'success');
    setTimeout(() => window.location.href = '/dashboard.html', 600);
  }catch(err){
    showMsg('Network error — is the server running?', 'error');
    btn.disabled = false;
    btn.textContent = mode === 'login' ? 'Log In' : 'Create Account';
  }
});
</script>
</body>
</html>
